<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>PROGRAMA DE SAÚDE</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <header class="topo">
        <div class="topo-left">
            <div class="brand">
                <span class="brand-name">PROGRAMA DE SAÚDE</span>
                <small>Linha de Cuidados</small>
            </div>
        </div>
        <div class="topo-right">
            <div class="topo-user">
                <span>Olá, Usuário!</span>
                <span class="user-status">Online</span>
            </div>
        </div>
    </header>

    <div class="layout">
        <aside class="menu">
            <div class="menu-title">LINHAS</div>
            <button class="menu-link active" type="button" data-programa="linha-de-cuidados" onclick="abrirPrograma('linha-de-cuidados', this)">
                <span class="menu-icon">📁</span>
                <span>Linha de Cuidado</span>
            </button>
            <button class="menu-link" type="button" data-programa="programa-de-rastreio" onclick="abrirPrograma('programa-de-rastreio', this)">
                <span class="menu-icon">🩺</span>
                <span>Programa de Rastreio</span>
            </button>
        </aside>

        <main class="conteudo">
            <section class="abas" aria-label="Seleção de linha de cuidado">
                <label for="abas-select" class="abas-label">Selecione a linha</label>
                <select id="abas-select" class="aba-select" onchange="abrirFormulario(this.value)"></select>
            </section>
            <section id="formulario" class="formulario"></section>
        </main>
    </div>

    <script src="script.js"></script>
</body>
</html>
